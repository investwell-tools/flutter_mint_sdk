group = "com.iw.mint.mint_sdk"
version = "7.6.13"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// The native mint-sdk AAR ships inside this package (../repo), so it resolves
// from the pub cache without any extra setup in the consumer app. It is added
// to every project because the consumer's :app module resolves this plugin's
// transitive dependencies with its own repositories.
def mintSdkRepo = file("${projectDir}/../repo")
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri(mintSdkRepo) }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.iw.mint.mint_sdk"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // mint-sdk's manifest declares minSdkVersion 25.
        minSdk = 25
    }
}

dependencies {
    implementation("com.investwell.tools:mint-sdk:7.6.13")
}
