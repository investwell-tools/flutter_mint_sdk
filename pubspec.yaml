name: mint_sdk
description: "Flutter plugin wrapping the Investwell Mint Android SDK."
version: 7.6.13
repository: https://github.com/investwell/mint-sdk-flutter
# Distributed as a git dependency pinned to a release tag, not via pub.dev.
publish_to: 'none'

environment:
  sdk: ^3.10.0-290.4.beta
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.iw.mint.mint_sdk
        pluginClass: MintSdkPlugin
