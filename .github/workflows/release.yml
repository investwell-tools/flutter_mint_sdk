name: Release

# Push a version tag (e.g. `git tag v1.0.1 && git push origin v1.0.1`) to
# verify the package and publish a GitHub Release. Consumers then pin it with:
#   mint_sdk:
#     git:
#       url: https://github.com/investwell/mint-sdk-flutter.git
#       ref: v1.0.1
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${version}"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # Compiles the Android plugin against the bundled mint-sdk AAR exactly the
      # way a consumer app would.
      - name: Build example APK
        working-directory: example
        run: |
          flutter pub get
          flutter test
          flutter build apk --debug

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: example/build/app/outputs/flutter-apk/app-debug.apk
